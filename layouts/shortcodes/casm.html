{{ $cTitle := or (.Get "cTitle") "C" }}
{{ $asmTitle := or (.Get "asmTitle") "Assembly" }}
{{ $cCode := .Get "c" | default "" }}
{{ $asmCode := .Get "asm" | default "" }}

<div class="casm">
  <div class="casm__pane">
    <div class="casm__title">{{ $cTitle }}</div>
    {{ highlight $cCode "c" "lineNos=inline" }}
  </div>
  <div class="casm__pane">
    <div class="casm__title">{{ $asmTitle }}</div>
    {{ highlight $asmCode "asm" "lineNos=inline" }}
  </div>
</div>
